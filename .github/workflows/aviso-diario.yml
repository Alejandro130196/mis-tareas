name: Aviso de las 8:00

on:
  schedule:
    - cron: '58 5,6 * * *'   # 7:58 en Madrid (una sirve en invierno, otra en verano; el script filtra)
  workflow_dispatch:
    inputs:
      forzar:
        description: 'Enviar ahora (ignorar la hora)'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  aviso:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Enviar aviso al móvil
        env:
          AVISO_CONFIG: ${{ secrets.AVISO_CONFIG }}
          FORZAR: ${{ inputs.forzar }}
        run: node .github/scripts/enviar-aviso.mjs
      # GitHub desactiva las tareas programadas tras 60 días sin actividad en el repo.
      # Si el último commit tiene más de 45 días, hace un commit vacío para mantenerla viva.
      - name: Mantener activa la programación
        run: |
          ultimo=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - ultimo )) -gt $(( 45 * 86400 )) ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "Mantener activo el aviso diario"
            git push
          fi
